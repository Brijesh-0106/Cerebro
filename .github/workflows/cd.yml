name: CI/CD CEREBRO
on:
  push:
    branched: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Code
        uses: actions/checkout@v3
      - name: Node Setup
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "cache"
      - name: Npm Install
        run: |
          cd /secondBrain
          npm ci
          cd ../secondBrainBackend
          npm ci
      - name: Docker Setup
        uses: docker/setup-buildx-action@v3
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USER}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Docker push
        run: |
          docker build -t brijesh408/cerebro-be:v${{github.run_number}} .
          cd ../secondBrain
          docker build -t brijesh408/cerebro-fe:v${{github.run_number}} .
          docker push brijesh408/cerebro-be:v${{github.run_number}}
          docker push brijesh408/cerebro-fe:v${{github.run_number}}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{github.SSH_HOST}}
          key: ${{github.SSH_KEY}}
          username: ${{github.SSH_USER}}
          script: |
            sudo docker pull brijesh408/cerebro-be:v${{github.run_number}}
            sudo docker pull brijesh408/cerebro-fe:v${{github.run_number}}
            sudo docker stop cerebro-fe || true
            sudo docker stop cerebro-be || true
            sudo docker rm cerebro-fe || true
            sudo docker rm cerebro-be || true
            sudo docker run -d -p 5173:5173 -e VITE_GOOGLE_CLIENT_ID=${{github.VITE_GOOGLE_CLIENT_ID}} -e VITE_BACKEND_URL=${{github.VITE_BACKEND_URL}} --restart unless-stopped --name cerebro-fe brijesh408/cerebro-fe:v${{github.run_number}}
            sudo docker run -d -p 8001:8001 -e GROQ_API_KEY=${{github.GROQ_API_KEY}} -e PINECONE_API_KEY=${{github.PINECONE_API_KEY}} -e MONGO_URI=${{github.MONGO_URI}} -e SECRET_KEY=${{github.SECRET_KEY}} -e GOOGLE_CLIENT_ID=${{github.GOOGLE_CLIENT_ID}} --restart unless-stopped --name cerebro-fe brijesh408/cerebro-be:v${{github.run_number}}
            sleep 5
            sudo docker ps
